[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-guests"
version = "0.1.1"
description = "Multi-user access for Hermes Agent: share your assistant on Telegram with separate memory and per-person permissions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["hermes-tenuo==0.4.0", "tenuo==0.3.7", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["python-telegram-bot>=22,<23", "PyYAML>=6,<7", "ruff>=0.9,<1", "build>=1,<2"]

[project.entry-points."hermes_agent.plugins"]
hermes-guests = "hermes_guests"

[tool.setuptools.packages.find]
include = ["hermes_guests*"]

[tool.setuptools.package-data]
hermes_guests = ["skills/*/SKILL.md", "skills/*/references/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
